name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux — engine + app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build C++ engine + run tests
        run: ./scripts/build-engine.sh

      - name: Rust checks
        working-directory: apps/desktop/src-tauri
        run: |
          cargo check
          cargo test

      - name: Web install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Web lint
        working-directory: apps/web
        run: pnpm lint

      - name: Web type-check
        working-directory: apps/web
        run: pnpm type-check

      - name: Web unit tests
        working-directory: apps/web
        run: pnpm test:unit

      - name: Web production build
        working-directory: apps/web
        run: pnpm build-only

  windows:
    name: Windows — engine + app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build C++ engine + run tests
        run: .\scripts\build-engine.ps1

      - name: Rust checks
        working-directory: apps/desktop/src-tauri
        run: |
          cargo check
          cargo test

      - name: Web install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Web lint
        working-directory: apps/web
        run: pnpm lint

      - name: Web type-check
        working-directory: apps/web
        run: pnpm type-check

      - name: Web unit tests
        working-directory: apps/web
        run: pnpm test:unit

      - name: Web production build
        working-directory: apps/web
        run: pnpm build-only